{% extends "base.html" %}
{% block title %}New User · SmartMES{% endblock %}
{% block page_title %}Add User{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="card p-6 fade-up">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-11 h-11 rounded-xl bg-brand-500/10 border border-brand-500/20 flex items-center justify-center">
        <i data-lucide="user-plus" class="w-5 h-5 text-brand-300"></i>
      </div>
      <div>
        <h2 class="text-lg font-bold text-white">New User</h2>
        <p class="text-xs text-white/45">Create a new system user</p>
      </div>
    </div>

    <form method="POST" class="space-y-5">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[11px] font-semibold text-white/50 uppercase tracking-wider mb-2">Username</label>
          <input name="username" required placeholder="e.g. operator2" class="input-glass font-mono">
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-white/50 uppercase tracking-wider mb-2">Full Name</label>
          <input name="full_name" placeholder="e.g. Ravi Kumar" class="input-glass">
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-white/50 uppercase tracking-wider mb-2">Password</label>
        <input name="password" type="text" required value="pass123" class="input-glass font-mono">
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-white/50 uppercase tracking-wider mb-2">Role</label>
        <select name="role_id" required class="input-glass">
          {% for r in roles %}
          <option value="{{ r.role_id }}" class="bg-ink-800">{{ r.role_name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="flex gap-3 pt-2">
        <button type="submit" class="btn-primary-glass flex-1 justify-center">
          <i data-lucide="check" class="w-4 h-4"></i> Create User
        </button>
        <a href="{{ url_for('users_admin') }}" class="btn-glass">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
