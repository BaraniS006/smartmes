{% extends "base.html" %}
{% block title %}New Station · SmartMES{% endblock %}
{% block page_title %}Add Station{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="card p-6 fade-up">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-11 h-11 rounded-xl bg-brand-500/10 border border-brand-500/20 flex items-center justify-center">
        <i data-lucide="settings-2" class="w-5 h-5 text-brand-300"></i>
      </div>
      <div>
        <h2 class="text-lg font-bold text-white">New Station</h2>
        <p class="text-xs text-white/45">Add a station to the assembly line</p>
      </div>
    </div>

    <form method="POST" class="space-y-5">
      <div>
        <label class="block text-[11px] font-semibold text-white/50 uppercase tracking-wider mb-2">Station Name</label>
        <input name="station_name" required placeholder="e.g. Paint Shop" class="input-glass">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[11px] font-semibold text-white/50 uppercase tracking-wider mb-2">Sequence #</label>
          <input name="sequence" type="number" min="1" value="6" required class="input-glass">
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-white/50 uppercase tracking-wider mb-2">Std Time (min)</label>
          <input name="standard_time" type="number" step="0.5" value="5.0" required class="input-glass">
        </div>
      </div>

      <div class="space-y-2">
        <label class="flex items-center gap-3 p-3 rounded-xl bg-white/[0.02] border border-white/8 cursor-pointer hover:border-white/16 transition">
          <input type="checkbox" name="is_qc_gate" class="w-4 h-4 accent-brand-500">
          <div>
            <div class="text-sm text-white font-medium">QC Gate</div>
            <div class="text-[10px] text-white/45">QC inspection happens after this station</div>
          </div>
        </label>
        <label class="flex items-center gap-3 p-3 rounded-xl bg-white/[0.02] border border-white/8 cursor-pointer hover:border-white/16 transition">
          <input type="checkbox" name="is_final" class="w-4 h-4 accent-brand-500">
          <div>
            <div class="text-sm text-white font-medium">Final Station</div>
            <div class="text-[10px] text-white/45">Chassis becomes COMPLETED after passing this station</div>
          </div>
        </label>
      </div>

      <div class="flex gap-3 pt-2">
        <button type="submit" class="btn-primary-glass flex-1 justify-center">
          <i data-lucide="check" class="w-4 h-4"></i> Add Station
        </button>
        <a href="{{ url_for('stations_admin') }}" class="btn-glass">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
